<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - F95Zone Release Monitor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e8474c'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='900' font-size='15' text-anchor='middle' fill='white'%3EF95%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/ui/style.css">
</head>
<body class="authbody">
<div class="authbox">
  <div class="authbrand"><span class="brand-f">F95</span><span class="brand-z">zone</span></div>
  <div class="authsub">Release Monitor</div>
  <form id="f" class="block" autocomplete="on">
    <div class="block-h"><span id="ttl">Sign in</span></div>
    <div class="block-b">
      <p class="muted small" id="hint" hidden>First run: create the administrator account for this control panel. Settings are configured inside the panel afterwards.</p>
      <label class="lbl">Username<input class="in" name="username" id="u" autocomplete="username" autofocus required></label>
      <label class="lbl">Password<input class="in" type="password" name="password" id="p" autocomplete="current-password" required></label>
      <label class="lbl" id="c2" hidden>Confirm password<input class="in" type="password" id="p2" autocomplete="new-password"></label>
      <div class="autherr" id="err" role="alert"></div>
      <button class="btn primary wide" id="go" type="submit">Sign in</button>
    </div>
  </form>
  <p class="muted small" style="text-align:center;margin-top:14px">The RSS feed itself needs no login.</p>
</div>
<script>
(async () => {
  const $ = s => document.querySelector(s);
  let setup = false;
  try {
    const st = await (await fetch('/api/auth/status')).json();
    if (st.authenticated) { location.replace('/'); return; }
    setup = st.setup_required;
  } catch {}
  if (setup) {
    $('#ttl').textContent = 'Create administrator'; $('#go').textContent = 'Create account';
    $('#hint').hidden = false; $('#c2').hidden = false; $('#p').autocomplete = 'new-password';
    $('#p').minLength = 8; $('#p2').required = true;
  }
  $('#f').onsubmit = async e => {
    e.preventDefault(); $('#err').textContent = '';
    if (setup && $('#p').value !== $('#p2').value) { $('#err').textContent = 'Passwords do not match'; return; }
    $('#go').disabled = true;
    try {
      const r = await fetch(setup ? '/api/auth/setup' : '/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'X-F95-UI': '1' },
        body: JSON.stringify({ username: $('#u').value, password: $('#p').value })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || r.statusText);
      location.replace(setup ? '/#/settings' : '/');
    } catch (err) { $('#err').textContent = err.message; $('#go').disabled = false; $('#p').select(); }
  };
})();
</script>
</body>
</html>
